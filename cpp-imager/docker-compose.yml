version: '3.8'

services:
  jetson-compression:
    build:
      context: .
      dockerfile: Dockerfile.jetpack5
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    volumes:
      - .:/workspace
      - ./data:/workspace/data
    working_dir: /workspace
    command: /bin/bash
    stdin_open: true
    tty: true 